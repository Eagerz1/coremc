# One-time milestone rewards granted the first time a player reaches a
# role level. Roles track claimed milestones in roles.yml so each grant
# fires exactly once. Reward keys are all optional:
#   tokens, credits, core-money, core-tokens, core-progression
#   cosmetic, skin, tag, gradient
#   omnitool-upgrade (+ omnitool-upgrade-levels)
#   message (MiniMessage, sent on claim)
#   rewards: [ "<item:DIAMOND>x3", ... ]  (loot table, resolved by RewardResolver)
role-milestones:
  MINING:
    5:
      message: "<bold><gray>Miner Lv5</bold> <gray>— small starter pack."
      tokens: 200
      rewards: [ "<item:IRON_ORE>x16" ]
    10:
      message: "<bold><aqua>Miner Lv10</bold> <gray>— Core bonus unlocked."
      tokens: 500
      core-money: 50.0
    20:
      message: "<bold><aqua>Miner Lv20</bold> <gray>— +5% mining Core contribution."
      tokens: 1000
      core-money: 200.0
      cosmetic: "season1_miner"
    30:
      message: "<bold><gold>Miner Lv30</bold> <gray>— major Core unlock."
      tokens: 2500
      core-money: 500.0
      core-tokens: 25.0
    40:
      message: "<bold><gold>Miner Lv40</bold> <gray>— OmniTool upgrade."
      tokens: 5000
      core-progression: 100
      omnitool-upgrade: "fortune"
      omnitool-upgrade-levels: 2
    50:
      message: "<bold><yellow>Miner Lv50</bold> <gray>— Season 1 endgame reward."
      tokens: 15000
      credits: 5000
      core-money: 2000.0
      core-tokens: 100.0
      skin: "miner_season1"
