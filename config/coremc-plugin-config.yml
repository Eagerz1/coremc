# Island Core contribution rates per role activity. Read by CoreConfig
# (island-core.contributions.<activity>.<money|tokens>). Routed through
# CoreService.contribute — no new currency.
island-core:
  contributions:
    mining: { money: 0.1, tokens: 0.1 }
    farming: { money: 0.1, tokens: 0.1 }
    logging: { money: 0.1, tokens: 0.1 }
    fishing: { money: 0.1, tokens: 0.1 }
  island-top:
    money-weight: 1.0
    token-weight: 1.0
  island:
    start-money: 0.0

