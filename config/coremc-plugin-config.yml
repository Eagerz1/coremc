# ---- skyblock-spawners ----
# Global island spawner cap. Never exceeds spawners.max-cap (5000).
# Each tier (except Pig) requires killing `requirement` of the PREVIOUS mob
# to unlock. `order` defines progression sequence (1 = first).
spawners:
  default-cap: 10
  cap-per-upgrade-level: 50
  max-cap: 5000
  spawners:
    pig:
      name: "Pig Spawner"
      mob: "PIG"
      price: 1000
      interval: 8
      requirement: 0
      order: 1
      variants:
        normal:
          name: "Normal"
          requirement: 0
          cost: 0
          multiplier: 1
          money: 10
          core: 20
          tokens: 1
          xp: 2
          benefit: "Baseline drops & value"
          drops:
            - material: "RAW_PORKCHOP"
              min: 1
              max: 3
              chance: 1.0
              sell: 3
              core: 5
              tokens: 1
        corrupted:
          name: "Corrupted"
          requirement: 200
          cost: 1500
          multiplier: 2
          money: 30
          core: 60
          tokens: 3
          xp: 3
          benefit: "Corrupted drops sell for more"
          drops:
            - material: "RAW_PORKCHOP"
              min: 1
              max: 3
              chance: 1.0
              sell: 5
              core: 9
              tokens: 1
        ancient:
          name: "Ancient"
          requirement: 1000
          cost: 4000
          multiplier: 3
          money: 100
          core: 180
          tokens: 9
          xp: 5
          benefit: "3x progression + high-value materials"
          drops:
            - material: "RAW_PORKCHOP"
              min: 1
              max: 3
              chance: 1.0
              sell: 10
              core: 17.5
              tokens: 1
        fourth:
          name: "Primordial"
          requirement: 4000
          cost: 10000
          multiplier: 4
          money: 300
