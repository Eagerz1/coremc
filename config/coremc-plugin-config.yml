# ===========================================================================
# CoreMC - consolidated configuration
# ===========================================================================

prefix: "<bold>COREMC</bold> <dark_gray>»</dark_gray> "

messages:
  reload: "<prefix> <green>Configuration reloaded."
  no-permission: "<prefix> <red>You do not have permission to do that."
  cooldown: "<prefix> <red>Please wait <time> before doing that again."
  player-not-found: "<prefix> <red>Could not find that player."

debug:
  enabled: false

gui:
  default-title: "CoreMC"
  filler-material: "BLACK_STAINED_GLASS_PANE"
  filler-name: " "
  close-on-filler-click: true

# ---- skyblock-core ----
island:
  schematic-folder: "schematics"
  default-biome: PLAINS

# ---- skyblock-progression ----
# token-rates / xp-rates: base amounts awarded per activity (before island buffs).
token-rates:
  mining: 5
  farming: 3
  fishing: 4
  logging: 3
  slaying: 2
  gens: 2
xp-rates:
  mining: 5
  farming: 4
  fishing: 5
  logging: 4
  slaying: 4
  gens: 3
# role-level-xp: cumulative XP to reach each role level (index = level).
# Level cap = list size - 1 (here 50). Edit to rebalance the whole season.
# Progressively increasing curve so later levels take meaningfully more effort.
role-level-xp: [0, 150, 400, 900, 1800, 3300, 5700, 9200, 14200, 21000, 30000, 42000, 58000, 78000, 103000, 134000, 172000, 218000, 273000, 339000, 418000, 510000, 619000, 747000, 897000, 1071000, 1273000, 1506000, 1774000, 2081000, 2431000, 2829000, 3280000, 3790000, 4365000, 5012000, 5738000, 6551000, 7459000, 8470000, 9593000, 10835000, 12208000, 13731000, 15408000, 17254000, 19284000, 21515000, 23964000, 26659000, 29620000]
# island-level-xp: island shared XP -> island level.
island-level-xp: [0, 500, 1500, 4000, 10000, 25000, 60000, 150000, 400000, 1000000]

# ============================================================
#  ROLE PROGRESSION SYSTEM
#  Per-role XP, levels, perks, milestones and Core modifiers.
#  Selection is untouched (RoleManager / RoleCommand). Progression
#  lives in roles.yml. Everything here is data-driven: tune without
#  touching Java.
# ============================================================

# Universal role earns a fraction of each supported activity instead of
# full credit. Kept below 1.0 so it stays flexible but never strictly
# better than a focused role.
universal:
  share:
    xp: 0.40
    tokens: 0.40
    core: 0.40

# Per-role perks. Each perk:
#   id            unique
#   role          owning role (MINING/FARMING/FISHING/LOGGING/SLAYING/UNIVERSAL)
#   unlock-level  level at which the perk becomes active
#   description   shown in the role GUI
#   effect        how RoleModifiers interprets it (see RoleModifiers)
#   values        effect-specific tuning
# Add perks freely; no Java change required in the driver.
role-perks:
  MINING:
    - id: mining_xp_1
      role: MINING
      unlock-level: 2
      description: "<gray>+10% mining XP from all mining activity."
      effect: xp_multiplier
      values: { multiplier: 0.10 }
    - id: mining_token_1
      role: MINING
      unlock-level: 5
      description: "<gray>+10% Sky Tokens from mining."
      effect: token_multiplier
      values: { multiplier: 0.10 }
    - id: mining_core_1
      role: MINING
      unlock-level: 10
      description: "<gray>+5% Core contribution from mining."
      effect: core_money_multiplier
      values: { multiplier: 0.05 }
    - id: mining_drop_1
      role: MINING
      unlock-level: 15
      description: "<gray>+5% chance for bonus ore drops."
      effect: drop_chance
      values: { chance: 0.05 }
    - id: mining_rare_1
      role: MINING
      unlock-level: 25
      description: "<gray>+3% chance for rare ore drops."
      effect: rare_drop_chance
      values: { chance: 0.03 }
    - id: mining_auto_1
      role: MINING
      unlock-level: 35
      description: "<gray>+15% Core Tokens from mining."
      effect: core_token_multiplier
      values: { multiplier: 0.15 }
    - id: mining_ability_fortune
      role: MINING
      unlock-level: 45
      description: "<bold><gold>OmniTool: Fortune</bold> <gray>unlocked."
      effect: ability
      values: { omnitool: fortune, levels: 1 }
  FARMING:
    - id: farm_xp_1
      role: FARMING
      unlock-level: 2
      description: "<gray>+10% farming XP from all harvesting."
      effect: xp_multiplier
      values: { multiplier: 0.10 }
