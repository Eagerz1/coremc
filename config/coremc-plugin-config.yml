    40: { message: "<bold><gold>Farmer Lv40</bold> <gray>— OmniTool upgrade.", tokens: 5000, core-progression: 100, omnitool-upgrade: "auto_sell", omnitool-upgrade-levels: 2 }
    50: { message: "<bold><yellow>Farmer Lv50</bold> <gray>— Season 1 endgame reward.", tokens: 15000, credits: 5000, core-money: 2000.0, core-tokens: 100.0, skin: "farmer_season1", tag: "farmer" }
