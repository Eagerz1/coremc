# ===========================================================================
# skyblock-progression - upgrade trees
# ===========================================================================
# token-rates / xp-rates / role-level-xp / island-level-xp live in config.yml.
# This file defines the six upgrade trees and their nodes only.
#
#

# Each tree has nodes with: name, cost (per level), max-level, requires (node ids),
# effect (integration key), description. Costs escalate; total per activity tree ~5M.
