# ===========================================================================
# CoreMC — BETA LOOTBOX
# ===========================================================================
# Theme: CoreMC Beta / Founders.
# Rewards communicate: "I was here during Beta."
# Loaded by LootboxManager from lootboxes/beta.yml. No Java changes needed.
# ===========================================================================

display:
  name: "BETA LOOTBOX"
  description: "Exclusive Beta & Founders rewards."
  icon-material: ENDER_CHEST
  icon-colour: light_purple
  theme: "beta"
  custom-model-data: ""

# Empty = available to everyone (no permission node required to open).
permission: ""

sounds:
  open: "ENTITY_ENDER_CHEST_OPEN"
  spin-start: "ENTITY_ITEM_PICKUP"
  spin-loop: "BLOCK_AMBIENT_CRIMSON_FOREST_LOOP"
  reveal: "UI_TOAST_CHALLENGE_COMPLETE"
  legendary: "ENTITY_LIGHTNING_BOLT_THUNDER"
  mythic: "ENTITY_ENDER_DRAGON_DEATH"
  lightning: "ENTITY_LIGHTNING_BOLT_THUNDER"

particles:
  type: "PORTAL"
  colour: "#aa55ff"

animation:
  rise-ticks: 50
  spin-ticks: 140
  reward-appear-delay-ticks: 10
  reward-appear-interval-ticks: 4
  spin-slowdown-ticks: 50
  reveal-pause-ticks: 30
  rise-height: 2.2
  particle-type: "PORTAL"
  particle-colour: "#aa55ff"
  sound-open: "ENTITY_ENDER_CHEST_OPEN"
  sound-spin-start: "ENTITY_ITEM_PICKUP"
  sound-spin-loop: "BLOCK_AMBIENT_CRIMSON_FOREST_LOOP"
  sound-reveal: "UI_TOAST_CHALLENGE_COMPLETE"
  sound-legendary: "ENTITY_LIGHTNING_BOLT_THUNDER"
  sound-mythic: "ENTITY_ENDER_DRAGON_DEATH"
  lightning-enabled: true
  lightning-strikes: 3
  lightning-sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
  screen-shake: true
  play-sounds: true
  stagger-delay-ticks: 1

rewards:
  # ---------------------------------------------------------------- COMMON
  beta_credits_500:
    type: credits
    amount: 500
    rarity: COMMON
    chance: 20.0
    display: "500 Credits"
    description: "CoreMC store credit."
    announce: false
    rarity-colour: "white"
  beta_tokens_100:
    type: tokens
    amount: 100
    rarity: COMMON
    chance: 20.0
    display: "100 SkyTokens"
    description: "Progression currency."
    announce: false
    rarity-colour: "white"
  beta_key_1:
    type: key
    key: vote
    amount: 1
    rarity: COMMON
    chance: 18.0
    display: "1x Crate Key"
    description: "A standard Vote Key."
    announce: false
    rarity-colour: "white"

  # -------------------------------------------------------------- UNCOMMON
  beta_credits_1000:
    type: credits
    amount: 1000
    rarity: UNCOMMON
    chance: 12.0
    display: "1,000 Credits"
    description: "CoreMC store credit."
    announce: false
    rarity-colour: "yellow"
  beta_tokens_250:
    type: tokens
    amount: 250
    rarity: UNCOMMON
    chance: 11.0
    display: "250 SkyTokens"
    description: "Progression currency."
    announce: false
    rarity-colour: "yellow"
  beta_key_3:
    type: key
    key: river
    amount: 3
    rarity: UNCOMMON
    chance: 9.0
    display: "3x Crate Keys"
    description: "River Keys."
