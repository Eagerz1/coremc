    rarity: EPIC
    chance: 1.0
    display: "Mini Skyblocker"
    description: "A tiny island companion."
    announce: true
    rarity-colour: "light_purple"
  sotw_companion_season_dragon:
    type: companion
    companion: season_dragon
    rarity: EPIC
    chance: 1.0
