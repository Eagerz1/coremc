# ===========================================================================
# CoreMC — SOTW LOOTBOX  (Start Of The World)
# ===========================================================================
# Theme: Start of the World / New Season.
# Celebrates the launch of a new CoreMC SkyBlock season — day-one players,
# fresh economy, new islands, exploration, competition, becoming established.
# Do NOT treat as "Server of the Week".
# Loaded by LootboxManager from lootboxes/sotw.yml. No Java changes needed.
# ===========================================================================

display:
  name: "SOTW LOOTBOX"
  description: "Start of the World — Season rewards."
  icon-material: NETHER_STAR
  icon-colour: gold
  theme: "sotw"
  custom-model-data: ""

# Empty = available to everyone (no permission node required to open).
permission: ""

sounds:
  open: "ENTITY_ENDER_CHEST_OPEN"
  spin-start: "ENTITY_ITEM_PICKUP"
  spin-loop: "BLOCK_AMBIENT_CRIMSON_FOREST_LOOP"
  reveal: "UI_TOAST_CHALLENGE_COMPLETE"
  legendary: "ENTITY_LIGHTNING_BOLT_THUNDER"
  mythic: "ENTITY_ENDER_DRAGON_DEATH"
  lightning: "ENTITY_LIGHTNING_BOLT_THUNDER"

particles:
  type: "PORTAL"
  colour: "#ffd700"

animation:
  rise-ticks: 50
  spin-ticks: 140
  reward-appear-delay-ticks: 10
  reward-appear-interval-ticks: 4
  spin-slowdown-ticks: 50
  reveal-pause-ticks: 30
  rise-height: 2.2
  particle-type: "PORTAL"
  particle-colour: "#ffd700"
  sound-open: "ENTITY_ENDER_CHEST_OPEN"
  sound-spin-start: "ENTITY_ITEM_PICKUP"
  sound-spin-loop: "BLOCK_AMBIENT_CRIMSON_FOREST_LOOP"
  sound-reveal: "UI_TOAST_CHALLENGE_COMPLETE"
  sound-legendary: "ENTITY_LIGHTNING_BOLT_THUNDER"
  sound-mythic: "ENTITY_ENDER_DRAGON_DEATH"
  lightning-enabled: true
  lightning-strikes: 3
  lightning-sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
  screen-shake: true
  play-sounds: true
  stagger-delay-ticks: 1

rewards:
  # ---------------------------------------------------------------- COMMON
  sotw_credits_1000:
    type: credits
    amount: 1000
    rarity: COMMON
    chance: 20.0
    display: "1,000 Credits"
    description: "CoreMC store credit."
    announce: false
    rarity-colour: "white"
  sotw_tokens_250:
    type: tokens
    amount: 250
    rarity: COMMON
    chance: 20.0
    display: "250 SkyTokens"
    description: "Progression currency."
    announce: false
    rarity-colour: "white"
  sotw_key_1:
    type: key
    key: vote
    amount: 1
    rarity: COMMON
    chance: 18.0
    display: "1x Crate Key"
    description: "A standard Vote Key."
    announce: false
    rarity-colour: "white"

  # -------------------------------------------------------------- UNCOMMON
  sotw_credits_2500:
    type: credits
    amount: 2500
    rarity: UNCOMMON
    chance: 12.0
    display: "2,500 Credits"
    description: "CoreMC store credit."
    announce: false
    rarity-colour: "yellow"
  sotw_tokens_500:
    type: tokens
    amount: 500
    rarity: UNCOMMON
    chance: 11.0
    display: "500 SkyTokens"
    description: "Progression currency."
    announce: false
    rarity-colour: "yellow"
  sotw_key_3:
    type: key
    key: river
    amount: 3
    rarity: UNCOMMON
    chance: 9.0
    display: "3x Crate Keys"
    description: "River Keys."
    announce: false
    rarity-colour: "yellow"

  # ------------------------------------------------------------------ RARE
  sotw_credits_5000:
    type: credits
    amount: 5000
    rarity: RARE
    chance: 6.0
    display: "5,000 Credits"
    description: "CoreMC store credit."
    announce: true
    rarity-colour: "aqua"
  sotw_tokens_1000:
    type: tokens
    amount: 1000
    rarity: RARE
    chance: 6.0
    display: "1,000 SkyTokens"
    description: "Progression currency."
    announce: true
    rarity-colour: "aqua"
  sotw_skin_season_starter:
    type: skin
    skin: season_starter
    rarity: RARE
    chance: 3.0
    display: "Season Starter Skin"
    description: "Day-one starter skin."
    announce: true
    rarity-colour: "aqua"
  sotw_tag_sotw:
    type: tag
    tag: SOTW
    rarity: RARE
    chance: 3.0
    display: "SOTW Tag"
    description: "Chat tag: [SOTW]"
    announce: true
    rarity-colour: "aqua"
  sotw_gradient_sotw_gold:
    type: gradient
    gradient: sotw_gold
    rarity: RARE
    chance: 3.0
    display: "SOTW Gold Gradient"
    description: "Chat gradient: SOTW Gold."
    announce: true
    rarity-colour: "aqua"

  # ------------------------------------------------------------------ EPIC
  sotw_credits_10000:
    type: credits
    amount: 10000
    rarity: EPIC
    chance: 2.5
    display: "10,000 Credits"
