omnitools:
# =============================================================================
  # CoreMC - OmniTool configuration
  # =============================================================================
  # This file is the single source of truth for the OmniTool / role-progression
  # system. It is fully configurable. Edits here are preserved across restarts.
  #

  # ---- OmniTool XP curve (TOOL LEVEL, per-Omnitool) ----
  # Cumulative tool-XP required to BE at each Tool Level. Index = level (level 1 = 0 XP).
  # The last index is the configurable cap. Numbers kept modest so progression stays balanced.
  tool-xp-curve: [0, 600, 1300, 2100, 3000, 4000, 5100, 6300, 7600, 9000, 10500, 12100, 13800, 15600, 17500, 19500, 21600, 23800, 26100, 28500, 31000, 33600, 36300, 39100, 42000, 45000, 48100, 51300, 54600, 58000, 61500, 65100, 68800, 72600, 76500, 80500, 84600, 88800, 93100, 97500, 102000, 106600, 111300, 116100, 121000, 126000, 131100, 136300, 141600, 147000, 152500]
  # Fallback flat value if tool-xp-curve is missing (kept for backwards compat).
  tool-xp-per-level: 1000
  # Max Tool Level (also = length of tool-xp-curve - 1).
  tool-level-cap: 50

  # Base tool-XP awarded per activity action (before event multipliers + OmniTool XP perk).
  # Kept small/balanced: tool XP comes from doing the role activity.
  xp-rewards:
    mining: 5
    farming: 4
    logging: 4
    fishing: 6
    slaying: 8
    universal: 4

  # Small base bonus each Tool Level gives to the role's PRIMARY stat (so the tool always
  # helps a little, and scales with investment). Per role; value is +fraction per tool level.
  role-bonus:
    MINING: { stat: mining_speed, per-tool-level: 0.01 }
    FARMING: { stat: farming_speed, per-tool-level: 0.01 }
    LOGGING: { stat: logging_speed, per-tool-level: 0.01 }
    FISHING: { stat: fishing_speed, per-tool-level: 0.01 }
    SLAYING: { stat: mob_damage, per-tool-level: 0.01 }
    UNIVERSAL: { stat: universal_speed, per-tool-level: 0.005 }

  # One Omnitool per role. Material + display colour + name.
  roles:
    MINING:
      material: DIAMOND_PICKAXE
      colour: blue
      name: "&9Mining Omnitool"
    FISHING:
      material: FISHING_ROD
      colour: aqua
      name: "&aFishing Omnitool"
    FARMING:
      material: DIAMOND_HOE
      colour: green
      name: "&aFarming Omnitool"
    LOGGING:
      material: DIAMOND_AXE
      colour: dark_green
      name: "&aLogging Omnitool"
    SLAYING:
      material: DIAMOND_SWORD
      colour: red
      name: "&cSlaying Omnitool"
    UNIVERSAL:
      material: DIAMOND_SHOVEL
      colour: gold
      name: "&6Universal Omnitool"

  # Omnitool upgrades. Each: name, max-level, base-cost, cost-multiplier, currency,
  # description, effect (shown to player), and the role currency it costs.
  # Cost to go from level N to N+1 = base-cost * cost-multiplier^N. All values editable.
  upgrades:
    efficiency:
      name: "Efficiency"
      max-level: 20
      base-cost: 500
      cost-multiplier: 1.5
      currency: MINING
      description: "Faster block breaks."
      effect: "+5% break speed per level"
    fortune:
      name: "Fortune"
      max-level: 20
      base-cost: 1000
      cost-multiplier: 1.6
      currency: MINING
      description: "More drops from blocks."
      effect: "+8% drop chance per level"
    rare_ore_chance:
      name: "Rare Ore Chance"
      max-level: 15
      base-cost: 2000
      cost-multiplier: 1.7
      currency: MINING
      description: "Chance to find rare ores."
      effect: "+1% rare ore chance per level"
    resource_chance:
