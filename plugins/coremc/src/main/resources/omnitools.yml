      max-level: 20
      base-cost: 1000
      cost-multiplier: 1.55
      currency: SLAYING
      description: "More XP from kills."
      effect: "+3% mob XP per level"
    crit_chance:
      name: "Crit Chance"
      max-level: 15
      base-cost: 2500
      cost-multiplier: 1.7
      currency: SLAYING
      description: "Chance for critical hits."
      effect: "+1% crit chance per level"

  # How each upgrade level converts into a Stat bonus (read by the central ModifierEngine).
  # stat = Stat enum name (lowercase); per-level = fraction added per upgrade level.
  upgrade-effects:
    efficiency: { stat: mining_speed, per-level: 0.05 }
    fortune: { stat: mining_drops, per-level: 0.08 }
    rare_ore_chance: { stat: mining_drops, per-level: 0.01 }
    resource_chance: { stat: mining_drops, per-level: 0.01 }
    generator_chance: { stat: mining_drops, per-level: 0.005 }
    speed: { stat: fishing_speed, per-level: 0.02 }
    bonus_drops: { stat: fishing_rewards, per-level: 0.03 }
    token_chance: { stat: token_multiplier, per-level: 0.01 }
    xp_gain: { stat: xp_multiplier, per-level: 0.03 }
    auto_sell: { stat: economy_multiplier, per-level: 0.02 }
    crop_yield: { stat: farming_yield, per-level: 0.04 }
    harvest_speed: { stat: farming_speed, per-level: 0.02 }
    log_yield: { stat: logging_yield, per-level: 0.04 }
    tree_feller: { stat: logging_speed, per-level: 0.05 }
    sapling_return: { stat: logging_yield, per-level: 0.02 }
    lifesteal: { stat: mob_damage, per-level: 0.01 }
    loot_quality: { stat: mob_drops, per-level: 0.03 }
    mob_xp: { stat: xp_multiplier, per-level: 0.03 }
    crit_chance: { stat: mob_damage, per-level: 0.01 }

